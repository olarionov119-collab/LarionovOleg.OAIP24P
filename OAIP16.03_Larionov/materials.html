<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Материалы</title>
</head>
<body>

{% block content %}
    {% for material in materials %}
        <a href="{{ url_for('materials_detail', material_id=material.id) }}">
            <h3>{{ material.title }}</h3>
            <p>{{ material.author }}</p>
        </a>
    {% endfor %}

{% endblock %}

</body>
</html>
