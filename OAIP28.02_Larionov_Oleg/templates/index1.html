<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Число по середине</title>
</head>
<body>

<h1>Число по середине</h1>

    {% if (a >= b and a <= c) or (a >= c and a <= b) %}
        {{ a }}
    {% elif (b >= c and b <= a) or (b >= a and b <= c) %}
        {{ b }}
    {% else %}
        {{ c }}
    {% endif %}

</body>
</html>
